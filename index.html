<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECECEA;--ink:#101010;--muted:#7b7b78;--line:#cfcfcb;--tile:#d9d9d5;--hot:#FF4A1C;--sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;--pad:clamp(1rem,2.4vw,2rem)}
@media (prefers-color-scheme:dark){:root{--bg:#111110;--ink:#ecece8;--muted:#85857f;--line:#2b2b29;--tile:#222220}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--sans);-webkit-font-smoothing:antialiased;isolation:isolate}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--hot);outline-offset:3px}
img{display:block;width:100%;height:100%;object-fit:cover}
.lab{font:400 .75rem/1.4 var(--mono);color:var(--muted);text-transform:none}
.skip{position:absolute;left:-999px}.skip:focus{left:var(--pad);top:var(--pad);z-index:99;background:var(--ink);color:var(--bg);padding:.4rem .8rem}
.view{display:none}.view.on{display:block}
.wrap{padding:0 var(--pad)}
main#main{position:relative;z-index:1}

/* top */
.top{display:grid;grid-template-columns:repeat(12,1fr);gap:1rem;padding:calc(1rem + env(safe-area-inset-top,0px)) var(--pad) 0}
.top>*{grid-column:span 3}
.top .info{grid-column:span 4}
.top .nav{grid-column:9/span 3;display:flex;flex-direction:column;align-items:flex-start}
.top .yr{grid-column:12/span 1;text-align:right;display:flex;flex-direction:column;align-items:flex-end}.manage-link{font:400 .64rem/1.3 var(--mono);color:var(--muted);text-decoration:underline;text-underline-offset:.18rem;margin-top:.2rem}.manage-link:hover{color:var(--hot)}
.nav a{font-size:.95rem}.nav a:hover,.nav a.cur{color:var(--hot)}
.top p{margin:.2rem 0 0;max-width:20rem;font-size:.95rem}
@media (max-width:760px){.top>*,.top .info,.top .nav,.top .yr{grid-column:1/-1;text-align:left}.top .yr{align-items:flex-start}.top{gap:.6rem}}

h1{margin:clamp(2rem,9vw,7rem) 0 0;padding:0 var(--pad);font-weight:500;letter-spacing:-.065em;line-height:.82;font-size:clamp(3.8rem,19vw,22rem);overflow-wrap:anywhere}

/* statement */
.state{position:relative;z-index:3;padding:clamp(3rem,10vw,9rem) var(--pad) clamp(2rem,6vw,5rem);display:grid;grid-template-columns:repeat(12,1fr);gap:2rem 1rem}
.state p{grid-column:1/span 9;margin:0;font-weight:400;font-size:clamp(1.6rem,4.6vw,4.4rem);line-height:1.05;letter-spacing:-.04em}
.state .pill{display:inline-block;vertical-align:middle;width:1.9em;height:.95em;border-radius:99px;overflow:hidden;background:var(--tile);margin:0 .08em}
.state aside{grid-column:10/span 3;align-self:end}
.state aside ul{list-style:none;margin:.6rem 0 1rem;padding:0;font-size:.9rem}
.state aside li{padding:.25rem 0;border-top:1px solid var(--line)}
.more{border-bottom:1px solid currentColor;font-size:.95rem}.more:hover{color:var(--hot)}
@media (max-width:900px){.state p,.state aside{grid-column:1/-1}}

/* oversized project list */
.list{position:relative;z-index:4;padding:2rem var(--pad) 0;margin-top:1rem;background:color-mix(in srgb,var(--bg) 78%,transparent)}
.list .head{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;padding:.6rem 0 .9rem;border-bottom:1px solid var(--line)}
.row{position:relative;display:block;padding:0 0 .7rem;border-top:1px solid var(--ink);letter-spacing:-.04em;transition:color .25s;will-change:transform,opacity}
.row-main{display:grid;grid-template-columns:1fr 1fr;align-items:start;position:relative;min-height:clamp(7rem,18vw,15rem);font-size:clamp(5rem,22vw,18rem);font-weight:600;line-height:.8;letter-spacing:-.075em;overflow:hidden}
.row .i,.row .in{font-family:var(--sans);font-size:inherit;font-weight:600;line-height:inherit;color:inherit;white-space:nowrap}
.row .in{grid-column:2;justify-self:start}
.row-arrow{position:absolute;right:.04em;top:.12em;font:400 clamp(3rem,8vw,8rem)/1 var(--sans);opacity:0;transform:translate(-.3em,.3em);transition:opacity .35s,transform .35s}
.row-meta{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:1rem;padding:.55rem 0 .2rem;border-top:1px solid var(--line);font:400 .66rem/1.3 var(--mono);text-transform:uppercase;letter-spacing:.02em}
.row-meta .y{text-align:right}.row:hover{color:var(--hot)}.row:hover .row-arrow{opacity:1;transform:translate(0,0)}.row:last-child{border-bottom:1px solid var(--ink)}
@media(max-width:760px){.list{padding-top:1.2rem}.list .head{display:none}.row-main{min-height:clamp(6rem,24vw,10rem);font-size:clamp(4.5rem,23vw,11rem)}.row-meta{grid-template-columns:1fr 1fr;row-gap:.3rem}.row-meta .y{text-align:left}.row-arrow{font-size:3rem}}
#peek{position:fixed;z-index:30;left:0;top:0;width:min(22rem,40vw);aspect-ratio:4/5;background:var(--tile);pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.92);transition:opacity .2s,transform .2s;overflow:hidden}
#peek.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#portraitStage{position:relative;min-height:160svh;padding:20svh var(--pad) 0;display:flex;justify-content:center;align-items:flex-start}
#scrollPortrait{position:sticky;top:20svh;width:min(44vw,34rem);height:min(60vh,40rem);opacity:0;pointer-events:none;transform:scale(.52);transform-origin:center center;transform-style:preserve-3d;will-change:transform;transition:opacity .3s ease;overflow:hidden}
#scrollPortrait .turn{position:absolute;inset:0;will-change:transform}
#scrollPortrait .photo-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;clip-path:inset(0 0 0 100%);filter:grayscale(.12);transition:opacity .8s cubic-bezier(.2,.7,.2,1),clip-path .95s cubic-bezier(.2,.7,.2,1)}
#scrollPortrait .photo-layer.active{opacity:1;clip-path:inset(0)}
#foldCanvas{position:absolute;z-index:3;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;transition:opacity .18s ease}
#foldCanvas.on{opacity:.96}
#mistCanvas{position:absolute;z-index:4;inset:0;width:100%;height:100%;pointer-events:none}
#canvas{position:fixed;z-index:2;inset:0;width:100vw;height:100vh;pointer-events:none;opacity:.78}
@media(max-width:760px){#portraitStage{min-height:125svh;padding-top:16svh}#scrollPortrait{top:16svh;width:min(74vw,25rem);height:54vh}}
@media(hover:none){#peek{display:none}}

/* footer */
.foot{margin-top:clamp(3rem,8vw,7rem);padding:1.5rem var(--pad) calc(1.5rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(12,1fr);gap:1.4rem 1rem}
.foot>div{grid-column:span 3}
@media (max-width:900px){.foot>div{grid-column:span 6}}
.foot .mail{font-size:1.05rem;border-bottom:1px solid currentColor}
.foot .mail:hover{color:var(--hot)}
.foot .sl{color:var(--muted);margin:0 .35rem}
.avail{margin:0 0 .2rem}

/* pages */
.page{padding:calc(6rem + env(safe-area-inset-top,0px)) var(--pad) 2rem}
.page h2{margin:0 0 2rem;font-weight:500;letter-spacing:-.06em;line-height:.9;font-size:clamp(2.6rem,11vw,9rem)}
.cols{display:grid;grid-template-columns:repeat(12,1fr);gap:2rem 1rem}
.cols .a{grid-column:1/span 6}.cols .b{grid-column:8/span 5}
@media (max-width:900px){.cols .a,.cols .b{grid-column:1/-1}}
.cols p{margin:0 0 1rem;font-size:clamp(1.15rem,2vw,1.6rem);line-height:1.3;letter-spacing:-.02em}
.cols ul{list-style:none;margin:.4rem 0 1.6rem;padding:0}
.cols li{padding:.4rem 0;border-top:1px solid var(--line)}
.pt{aspect-ratio:4/5;background:var(--tile);overflow:hidden;max-width:24rem;margin-bottom:1.4rem}
.imgs{display:grid;gap:var(--pad);margin-top:2rem}
.imgs .ph{background:var(--tile);aspect-ratio:16/10;overflow:hidden;display:grid;place-items:center;font:.8rem var(--mono);color:var(--muted)}
.imgs .ph{clip-path:inset(0 0 0 100%);animation:photo-reveal .9s cubic-bezier(.2,.7,.2,1) calc(var(--photo-index,0)*.1s) both}
@keyframes photo-reveal{to{clip-path:inset(0)}}
.next{display:flex;justify-content:space-between;margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);font-size:1.5rem;letter-spacing:-.03em}
.next:hover{color:var(--hot)}
@keyframes page-enter{from{opacity:0;transform:translateY(1.2rem)}to{opacity:1;transform:translateY(0)}}
.view.on{animation:page-enter .7s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<main id="main">
 <section class="view" id="v-home">
  <div class="top" id="top">
    <div class="info"><span class="lab">Info:</span><p id="intro"></p></div>
    <div class="nav-wrap" style="grid-column:span 2"></div>
    <div class="nav" id="nav1"></div>
    <div class="yr lab" id="yr"></div>
  </div>
  <h1 id="name"></h1>
  <div class="state"><p id="stmt"></p>
    <aside><span class="lab">Info:</span><p style="margin:.3rem 0;font-size:.95rem" id="rec"></p><ul id="awards"></ul>
      <p class="lab avail" id="avail"></p><a class="more" href="#about">More about</a></aside></div>
  <div class="portrait-stage" id="portraitStage" aria-label="Portrait transition">
    <div id="scrollPortrait" aria-hidden="true"><div class="turn"><img class="photo-layer active" id="scrollPortraitA" alt=""><img class="photo-layer" id="scrollPortraitB" alt=""></div><canvas id="foldCanvas"></canvas><canvas id="mistCanvas"></canvas></div>
  </div>
  <div class="list" id="work">
    <div class="head lab"><span>Project</span><span></span><span>Name</span><span>With</span><span style="text-align:right">Year</span></div>
    <div id="rows"></div>
  </div>
 </section>

 <section class="view" id="v-about"><div class="page"><h2>About</h2>
   <div class="cols"><div class="a" id="ab"></div><div class="b" id="ab2"></div></div></div></section>

 <section class="view" id="v-project"><div class="page" id="proj"></div></section>
</main>

<div class="foot">
  <div><span class="lab">Nav.:</span><div class="nav" id="nav2" style="display:flex;flex-direction:column"></div></div>
  <div><span class="lab">Socials:</span><p style="margin:.2rem 0" id="soc"></p></div>
  <div><span class="lab">Email:</span><p style="margin:.2rem 0"><button class="mail" id="mail"></button></p></div>
  <div><span class="lab" id="cred"></span></div>
</div>
<div id="peek"></div>
<canvas id="canvas" class="pointer-events-none fixed inset-0" aria-hidden="true"></canvas>

<script src="content.js"></script>
<script>
const S = window.SITE, P = S.projects, $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const img = (src, alt) => src ? `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">` : "";
const initials = n => n.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
const pad = n => String(n).padStart(2, "0");

document.title = `${S.name}, ${S.role}`;
(document.querySelector("meta[name=description]") || document.head.appendChild(Object.assign(document.createElement("meta"), {name: "description"}))).content = S.description;

/* shared bits */
const navHTML = `<a href="#home" data-h="home">Home</a><a href="#work" data-h="work">Projects (${P.length})</a><a href="#about" data-h="about">About</a>`;
$("#nav1").innerHTML = $("#nav2").innerHTML = navHTML;
const year = new Date().getFullYear();
$("#yr").innerHTML = "©" + year + " " + esc(S.name) + "<a class=\"manage-link\" href=\"manager.html\">Manage</a>";
$("#intro").textContent = S.intro;
$("#name").textContent = S.name;
$("#stmt").innerHTML = esc(S.statement).replace("{img}", `<span class="pill">${img(S.statementImg, "")}</span>`);
$("#rec").textContent = S.about.recognition;
$("#awards").innerHTML = S.about.awards.map(a => `<li>${esc(a)}</li>`).join("");
$("#avail").innerHTML = S.availableFrom ? `Available from:<br>${esc(S.availableFrom)}` : "";
$("#soc").innerHTML = S.socials.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join('<span class="sl">/</span>');
$("#cred").innerHTML = S.credit.label ? (S.credit.url ? `<a href="${esc(S.credit.url)}" target="_blank" rel="noopener">${esc(S.credit.label)}</a>` : esc(S.credit.label)) : "";
$("#mail").textContent = S.email;
$("#mail").onclick = async () => { try { await navigator.clipboard.writeText(S.email); $("#mail").textContent = "Copied"; setTimeout(() => $("#mail").textContent = S.email, 1400); } catch (e) { location.href = "mailto:" + S.email; } };

/* project rows */
$("#rows").innerHTML = P.map((p, i) => {
  const href = p.url ? esc(p.url) : "#p/" + esc(p.id), ext = p.url ? ' target="_blank" rel="noopener"' : "";
  const projectNo = "Project " + pad(i + 1);
  return '<a class="row" href="' + href + '"' + ext + ' data-i="' + i + '"><div class="row-main"><span class="i">P.' + pad(i + 1) + '</span><span class="in">' + initials(p.name) + '</span><span class="row-arrow" aria-hidden="true">↗</span></div><div class="row-meta"><span>' + projectNo + '</span><span>' + esc(p.name) + '</span><span>' + (p.with ? 'With: ' + esc(p.with) : '') + '</span><span class="y">' + esc(p.year) + '</span></div></a>';
}).join("");

/* hover preview follows the cursor */
const peek = $("#peek"); let tx = 0, ty = 0, cx = 0, cy = 0, raf = 0;
const scrollPortrait = $("#scrollPortrait");
const photoLayers = [$("#scrollPortraitA"), $("#scrollPortraitB")];
const foldCanvas=$("#foldCanvas"), foldContext=foldCanvas.getContext("2d"), foldImage=new Image();
const mistCanvas=$("#mistCanvas"), mistContext=mistCanvas.getContext("2d");
let mistPoints=[], mistFrame=0;
function addMist(x,y,angle,intensity=1){const t=performance.now(),count=2+Math.min(3,Math.round(intensity));for(let i=0;i<count;i++)mistPoints.push({x:x+(Math.random()-.5)*14,y:y+(Math.random()-.5)*14,angle:angle+(Math.random()-.5)*.7,r:24+Math.random()*32,life:650+Math.random()*450,born:t,alpha:.09+Math.random()*.1});if(!mistFrame)mistFrame=requestAnimationFrame(drawMist);}
function drawMist(now){mistFrame=0;const w=scrollPortrait.clientWidth,h=scrollPortrait.clientHeight,ratio=Math.min(devicePixelRatio||1,2),cw=Math.round(w*ratio),ch=Math.round(h*ratio);if(mistCanvas.width!==cw||mistCanvas.height!==ch){mistCanvas.width=cw;mistCanvas.height=ch;}const ctx=mistContext;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);mistPoints=mistPoints.filter(p=>now-p.born<p.life);ctx.globalCompositeOperation="screen";for(const p of mistPoints){const age=(now-p.born)/p.life,fade=Math.sin(Math.PI*age),r=p.r*(.75+age*.55);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.scale(1.9,.66);const g=ctx.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,"rgba(255,255,248,"+(p.alpha*fade)+")");g.addColorStop(.38,"rgba(238,242,242,"+(p.alpha*.62*fade)+")");g.addColorStop(1,"rgba(255,255,255,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.restore();}ctx.globalCompositeOperation="source-over";if(mistPoints.length)mistFrame=requestAnimationFrame(drawMist);}
const trailCanvas=$("#canvas"),trailContext=trailCanvas.getContext("2d"),trailPointer={x:innerWidth/2,y:innerHeight/2,active:false},trailLines=[];let lastPointerClientX=innerWidth/2,lastPointerClientY=innerHeight/2,lastTrailScroll=scrollY;
for(let i=0;i<20;i++)trailLines.push({spring:.38+i*.0018,friction:.48+Math.random()*.025,nodes:Array.from({length:50},()=>({x:innerWidth/2,y:innerHeight/2,vx:0,vy:0}))});
function resizeCanvasCursor(){const ratio=Math.min(devicePixelRatio||1,2);trailCanvas.width=Math.round(innerWidth*ratio);trailCanvas.height=Math.round(innerHeight*ratio);trailContext.setTransform(ratio,0,0,ratio,0,0);}
function drawTrail(line,index){const nodes=line.nodes,ctx=trailContext;ctx.beginPath();ctx.moveTo(nodes[0].x,nodes[0].y);for(let i=1;i<nodes.length-1;i++){const a=nodes[i],b=nodes[i+1];ctx.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2);}const pen=nodes[nodes.length-2],last=nodes[nodes.length-1];ctx.quadraticCurveTo(pen.x,pen.y,last.x,last.y);ctx.lineWidth=.7+index*.035;ctx.stroke();}
function renderCanvasCursor(){const ctx=trailContext;ctx.clearRect(0,0,innerWidth,innerHeight);if(trailPointer.active){ctx.globalCompositeOperation="source-over";ctx.strokeStyle="rgba(76,78,77,.09)";ctx.shadowColor="rgba(68,70,69,.1)";ctx.shadowBlur=8;trailLines.forEach((line,index)=>{let spring=line.spring;const head=line.nodes[0];head.vx+=(trailPointer.x-head.x)*spring;head.vy+=(trailPointer.y-head.y)*spring;for(let i=0;i<line.nodes.length;i++){const node=line.nodes[i];if(i){const previous=line.nodes[i-1];node.vx+=(previous.x-node.x)*spring+previous.vx*.23;node.vy+=(previous.y-node.y)*spring+previous.vy*.23;}node.vx*=line.friction;node.vy*=line.friction;node.x+=node.vx;node.y+=node.vy;spring*=.98;}drawTrail(line,index);});ctx.shadowBlur=0;}requestAnimationFrame(renderCanvasCursor);}
resizeCanvasCursor();renderCanvasCursor();addEventListener("resize",resizeCanvasCursor,{passive:true});
addEventListener("scroll",()=>{const dy=scrollY-lastTrailScroll;lastTrailScroll=scrollY;if(trailPointer.active&&Math.abs(dy)>1){trailLines.forEach(line=>line.nodes.forEach((node,i)=>{node.y-=dy*(.5-i/line.nodes.length*.35)}));}},{passive:true});
let foldActive=false, foldX=0, foldY=0, foldAngle=0, lastPointerX=0, lastPointerY=0;
const fallbackPortrait = "data:image/svg+xml;charset=utf-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900"><defs><radialGradient id="paper" cx="48%" cy="34%" r="70%"><stop stop-color="#f5f5f2"/><stop offset="1" stop-color="#b9b9b5"/></radialGradient><linearGradient id="form" x1="0" x2="1" y1=".2" y2=".8"><stop stop-color="#101010"/><stop offset=".42" stop-color="#595957"/><stop offset=".7" stop-color="#171717"/><stop offset="1" stop-color="#080808"/></linearGradient></defs><rect width="720" height="900" fill="url(#paper)"/><path fill="url(#form)" d="M70 900c25-154 104-225 204-263l48-18 9-62c-60-28-95-87-99-161-8-121 48-214 145-223 115-11 196 77 196 210 0 80-35 145-98 177l9 59 58 20c103 37 182 112 204 261z"/><path fill="#a8a8a5" opacity=".48" d="M257 354c0-117 45-195 122-195 79 0 133 77 133 190 0 91-39 156-103 174-73 20-152-43-152-169z"/><path fill="#171717" d="M477 313c30 12 40 34 31 54l-33 9c12-19 7-39 2-63z"/><path fill="#d4d4d0" opacity=".55" d="M332 300c22-11 49-10 68 2m-70 55c16 4 29 4 43-1" fill="none" stroke="#d4d4d0" stroke-width="8" stroke-linecap="round"/></svg>');
let activePhotoLayer = 0, currentPhoto = "";
const portraitSource = S.statementImg || S.about.portrait || (P.find(p => p.cover) || {}).cover || fallbackPortrait;
function transitionPhoto(src) {
  src = src || fallbackPortrait;
  if (src === currentPhoto) return;
  const next = 1 - activePhotoLayer, incoming = photoLayers[next], outgoing = photoLayers[activePhotoLayer];
  incoming.classList.remove("active"); incoming.src = src;
  foldImage.src=src;
  requestAnimationFrame(() => { incoming.classList.add("active"); outgoing.classList.remove("active"); });
  activePhotoLayer = next; currentPhoto = src;
}
function drawFold(){
  if(!foldActive||!foldImage.complete||!foldImage.naturalWidth)return;
  const w=scrollPortrait.clientWidth, h=scrollPortrait.clientHeight, ratio=Math.min(devicePixelRatio||1,2);
  if(w<2||h<2)return;
  const cw=Math.round(w*ratio),ch=Math.round(h*ratio);
  if(foldCanvas.width!==cw||foldCanvas.height!==ch){foldCanvas.width=cw;foldCanvas.height=ch;}
  const ctx=foldContext;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);
  const scale=Math.max(w/foldImage.naturalWidth,h/foldImage.naturalHeight),dw=foldImage.naturalWidth*scale,dh=foldImage.naturalHeight*scale,ox=(w-dw)/2,oy=(h-dh)/2;
  const nx=-Math.sin(foldAngle),ny=Math.cos(foldAngle),tx=Math.cos(foldAngle),ty=Math.sin(foldAngle),alongSize=Math.min(150,Math.max(80,w*.22)),acrossSize=31;
  function point(x,y){const dx=x-foldX,dy=y-foldY,along=dx*tx+dy*ty,across=dx*nx+dy*ny,band=Math.exp(-Math.pow(along/alongSize,2)-Math.pow(across/acrossSize,2)),ripple=Math.sin(along*.055)*Math.exp(-Math.abs(along)/130)*Math.exp(-Math.abs(across)/50)*3,bend=across/acrossSize*Math.exp(-Math.pow(across/acrossSize,2)*.5)*band*17+ripple;return{x:x+nx*bend,y:y+ny*bend};}

foldImage.onload=()=>drawFold();
transitionPhoto(portraitSource);
const scaleMotion={value:.34,velocity:0}, offsetMotion={value:20,velocity:0};
const pointerXMotion={value:0,velocity:0}, pointerYMotion={value:0,velocity:0};
const tiltXMotion={value:0,velocity:0},tiltYMotion={value:0,velocity:0},foldXMotion={value:0,velocity:0},foldYMotion={value:0,velocity:0};
let scaleTarget=.34, offsetTarget=20, pointerXTarget=0, pointerYTarget=0,tiltXTarget=0,tiltYTarget=0,foldTargetX=0,foldTargetY=0,portraitFrame=0,homeActive=true;
const tick = () => { cx += (tx - cx) * .18; cy += (ty - cy) * .18; peek.style.left = cx + "px"; peek.style.top = cy + "px"; raf = peek.classList.contains("on") ? requestAnimationFrame(tick) : 0; };
$("#rows").addEventListener("pointerover", e => { const r = e.target.closest(".row"); if (!r) return; pointerOverProject = true; const p = P[+r.dataset.i]; peek.innerHTML = img(p.cover, p.name); peek.classList.remove("scroll-active"); peek.classList.add("on"); if (!raf) raf = requestAnimationFrame(tick); });

  tx = e.clientX + 40; ty = e.clientY; if (!peek.classList.contains("on")) { cx = tx; cy = ty; }
  if(e.pointerType!=="touch"){if(!trailPointer.active)trailLines.forEach(line=>line.nodes.forEach(node=>{node.x=e.clientX;node.y=e.clientY;node.vx=node.vy=0;}));trailPointer.x=e.clientX;trailPointer.y=e.clientY;trailPointer.active=true;lastPointerClientX=e.clientX;lastPointerClientY=e.clientY;}
  const rect=scrollPortrait.getBoundingClientRect(), over=e.pointerType!=="touch"&&scrollPortrait.style.opacity!=="0"&&e.clientX>=rect.left&&e.clientX<=rect.right&&e.clientY>=rect.top&&e.clientY<=rect.bottom;

/* about */
const A = S.about;
$("#ab").innerHTML = (A.portrait ? `<div class="pt">${img(A.portrait, S.name)}</div>` : "") + A.text.map(t => `<p>${esc(t)}</p>`).join("");

  <span class="lab">Services:</span><ul>${A.services.map(a => `<li>${esc(a)}</li>`).join("")}</ul>`;

/* Scroll-linked motion: title drifts away while work rows lift into view. */
const motionReduced = matchMedia("(prefers-reduced-motion: reduce)");
let motionFrame = 0, pointerOverProject = false;
function springTo(motion, target, dt, stiffness=6) {

}
function animatePortrait(now) {

  $("#name").style.transformOrigin = "left top";

  $("#stmt").style.transform = "translate3d(0," + (-progress * 2.5) + "rem,0)";
  $("#stmt").style.opacity = String(1 - progress * .18);

  rows.forEach(row => {
    const rect = row.getBoundingClientRect();

/* routing: #home  #work  #about  #p/<id> */
function route() {
