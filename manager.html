<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manager — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECECEA;--ink:#101010;--muted:#73736f;--line:#c8c8c3;--hot:#FF4A1C;--sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;--mono:"DM Mono",monospace;--pad:clamp(1rem,2.4vw,2rem)}@media(prefers-color-scheme:dark){:root{--bg:#111110;--ink:#ecece8;--muted:#85857f;--line:#2b2b29}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--sans)}a{color:inherit}.top{padding:1rem var(--pad);display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.mono{font:.72rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.wrap{max-width:1100px;margin:auto;padding:clamp(2rem,6vw,5rem) var(--pad)}h1{font-size:clamp(3rem,11vw,8rem);line-height:.84;letter-spacing:-.07em;font-weight:500;margin:.8rem 0 2rem}h2{font-size:1.35rem;font-weight:500;margin:0 0 1rem}.intro{max-width:34rem;color:var(--muted);margin-bottom:2rem}.box{border:1px solid var(--line);padding:clamp(1rem,3vw,2rem);margin-bottom:1rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.field{display:grid;gap:.35rem;min-width:0}.field.full{grid-column:1/-1}.field label,.lab{font:.7rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:transparent;color:var(--ink);padding:.7rem .8rem;font:inherit}.field textarea{min-height:6rem;resize:vertical}.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:.7rem 1rem;cursor:pointer;font:.7rem var(--mono);letter-spacing:.06em;text-transform:uppercase}.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}.btn.danger{background:transparent;color:#c43;border-color:#c43}.btn:disabled{opacity:.45;cursor:not-allowed}.small{font-size:.8rem;color:var(--muted)}.login{max-width:680px}.manager[hidden],.login[hidden]{display:none}.projects{display:grid;gap:.8rem}.project{border:1px solid var(--line);padding:1rem}.project-head{display:flex;justify-content:space-between;gap:1rem;align-items:center;margin-bottom:.8rem}.project .grid{gap:.8rem}.image-row{display:flex;align-items:center;gap:.8rem}.image-row img{width:100px;height:80px;object-fit:cover;background:#d9d9d5}.items{display:grid;gap:.5rem}.item-row{display:flex;gap:.5rem}.item-row input{flex:1;min-width:0}.bar{position:sticky;bottom:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:1rem 0;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.status{font-size:.85rem;color:#28824f;margin-left:auto}.status.err{color:#c43}@media(max-width:700px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.status{width:100%;margin:0}.top{gap:1rem}}
</style></head><body>
<header class="top"><a href="index.html">← Portfolio</a><span class="mono">Owner manager</span></header>
<main class="wrap"><span class="mono">Editable template</span><h1>Site<br>manager.</h1><p class="intro">Edit the identity, categories, contact details and projects for this portfolio. Changes stay in this tab until you publish them.</p>
<section class="box login" id="loginPanel"><h2>Log in</h2><div class="grid"><div class="field"><label for="owner">GitHub owner</label><input id="owner" type="text" autocomplete="off" placeholder="Owner"></div><div class="field"><label for="repo">Repository name</label><input id="repo" type="text" autocomplete="off" placeholder="Repository"></div><div class="field full"><label for="token">Repository token</label><input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></div><div class="field full"><button class="btn" id="login">Log in and open manager</button><span id="loginStatus" class="small" role="status">Enter your repository details and token.</span></div></div></section>
<div class="manager" id="manager" hidden><div class="box" style="display:flex;justify-content:space-between;gap:1rem;align-items:center"><span id="connection" class="small">Connected</span><button id="logout" class="btn alt">Log out</button></div>
<section class="box"><h2>Identity & category</h2><div class="grid"><div class="field"><label for="name">Name</label><input id="name"></div><div class="field"><label for="role">Role / category</label><input id="role"></div><div class="field full"><label for="description">Search description</label><textarea id="description"></textarea></div><div class="field full"><label for="intro">Short intro</label><textarea id="intro"></textarea></div><div class="field full"><label for="statement">Home statement (use {img} for inline portrait)</label><textarea id="statement"></textarea></div><div class="field"><label for="available">Available from</label><input id="available"></div><div class="field"><label for="email">Contact email</label><input id="email" type="email"></div><div class="field"><label for="creditLabel">Credit label</label><input id="creditLabel"></div><div class="field"><label for="creditUrl">Credit URL</label><input id="creditUrl" type="url"></div>
<div class="field"><label for="statementInput">Statement image</label><div class="image-row"><img id="statementPreview" alt="Statement image"><input id="statementInput" type="file" accept="image/*"></div></div><div class="field"><label for="portraitInput">About portrait</label><div class="image-row"><img id="portraitPreview" alt="Portrait preview"><input id="portraitInput" type="file" accept="image/*"></div></div></div></section>
<section class="box"><h2>About</h2><div class="grid"><div class="field"><label for="aboutText">Bio paragraphs (one per line)</label><textarea id="aboutText"></textarea></div><div class="field"><label for="recognition">Recognition summary</label><textarea id="recognition"></textarea></div><div class="field"><label for="awards">Awards / publications (one per line)</label><textarea id="awards"></textarea></div><div class="field"><label for="services">Services / specialties (one per line)</label><textarea id="services"></textarea></div><div class="field full"><label for="socials">Social links (one per line: label | URL)</label><textarea id="socials"></textarea></div></div></section>
<section class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:1rem"><h2>Projects</h2><button id="addProject" class="btn alt">+ Add project</button></div><div id="projects" class="projects"></div></section>
<div class="bar"><button id="publish" class="btn" disabled>Publish changes</button><button id="export" class="btn alt">Export backup</button><label class="btn alt" for="importFile">Import backup</label><input id="importFile" type="file" accept="application/json" hidden><span id="status" class="status" role="status"></span></div></div></main>
<script src="content.js"></script><script src="manager.js"></script></body></html>
